<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gloaming — Queue</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="queue">
  <div class="bar" aria-hidden="true"></div>
  <header class="top">
    <div class="brand-row">
      <a class="brand" href="queue.html">Gloaming</a>
      <nav class="nav">
        <a href="queue.html" data-page="queue">Queue</a>
        <a href="search.html" data-page="search">Search</a>
      </nav>
    </div>
    <div class="session">
      <span class="who"></span>
      <button class="text-btn" id="logout" type="button">Sign out</button>
    </div>
  </header>
  <main class="page">
    <div class="queue-body">
      <section class="hero">
        <div class="hero-main">
          <h1 class="eyebrow">Your queue</h1>
          <p class="hero-total"></p>
          <p class="summary"></p>
        </div>
        <div class="hero-dates" hidden></div>
      </section>
      <p class="rhythm-line"></p>
      <p class="letter" hidden></p>
      <div class="tune">
        <form class="rhythm">
          <label>Minutes a day<input name="daily" inputmode="numeric" placeholder="40" autocomplete="off"></label>
        </form>
        <span class="tune-rule" aria-hidden="true"></span>
        <form class="time">
          <label>Hours<input name="hours" inputmode="numeric" value="1"></label>
          <label>Minutes<input name="minutes" inputmode="numeric" value="30"></label>
          <button class="primary" type="submit">Build plan</button>
        </form>
      </div>
      <div class="alert"><div><p></p></div></div>
      <section class="plan">
        <div class="plan-inner">
          <div class="timebar">
            <div class="timebar-track"></div>
          </div>
          <p class="plan-total"></p>
          <div class="plan-lines"></div>
          <p class="plan-note"></p>
        </div>
      </section>
      <h2 class="section-title">Up next</h2>
      <ol class="queue"></ol>
      <section class="picks" hidden>
        <h2 class="section-title">Similar</h2>
        <div class="pick-list"></div>
      </section>
      <form class="account-mail">
        <label>Letters go to<input name="email" type="email" autocomplete="email" spellcheck="false" placeholder="you@example.com"></label>
        <button class="text-btn" type="submit">Save</button>
      </form>
      <p class="notice account-mail-note" hidden></p>
    </div>
    <section class="empty-gate">
      <div class="empty-card">
        <p class="lede">The queue is empty.</p>
        <a class="primary" href="search.html">Find a film or a series</a>
      </div>
      <div class="start">
        <p class="start-label">Start with one of these</p>
        <p class="shelf-error" hidden></p>
        <div class="shelf"></div>
        <div class="start-open" hidden></div>
      </div>
    </section>
  </main>
  <div class="undo" role="status" inert>
    <p></p>
    <button class="text-btn" id="undo" type="button">Undo</button>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
