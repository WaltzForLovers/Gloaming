<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gloaming — Очередь</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="queue">
  <div class="bar" aria-hidden="true"></div>
  <header class="top">
    <div class="brand-row">
      <a class="brand" href="queue.html">Gloaming</a>
      <nav class="nav">
        <a href="queue.html" data-page="queue">Очередь</a>
        <a href="search.html" data-page="search">Поиск</a>
      </nav>
    </div>
    <div class="session">
      <span class="who"></span>
      <button class="text-btn" id="logout" type="button">Выйти</button>
    </div>
  </header>
  <main class="page">
    <form class="account-mail">
      <label>Почта<input name="email" type="email" autocomplete="email" spellcheck="false"></label>
      <button class="text-btn" type="submit">Сохранить</button>
    </form>
    <p class="notice account-mail-note" hidden></p>
    <div class="queue-body">
      <h1>Очередь</h1>
      <p class="summary"></p>
      <p class="rhythm-line"></p>
      <p class="letter" hidden></p>
      <form class="rhythm">
        <label>Минут в день<input name="daily" inputmode="numeric" placeholder="40" autocomplete="off"></label>
      </form>
      <form class="time">
        <label>Часы<input name="hours" inputmode="numeric" value="1"></label>
        <label>Минуты<input name="minutes" inputmode="numeric" value="30"></label>
        <button class="primary" type="submit">Собрать план</button>
      </form>
      <div class="alert"><div><p></p></div></div>
      <section class="plan">
        <div class="plan-inner">
          <div class="timebar">
            <div class="timebar-track"></div>
          </div>
          <p class="plan-total"></p>
          <div class="plan-lines"></div>
          <p class="plan-note"></p>
        </div>
      </section>
      <ol class="queue"></ol>
      <section class="picks" hidden>
        <h2>Похожее</h2>
        <div class="pick-list"></div>
      </section>
    </div>
    <section class="empty-gate">
      <div class="empty-card">
        <p class="lede">Очередь пустая.</p>
        <a class="primary" href="search.html">Найти фильм или сериал</a>
      </div>
      <div class="start">
        <p class="start-label">Можно начать с этого</p>
        <p class="shelf-error" hidden></p>
        <div class="shelf"></div>
        <div class="start-open" hidden></div>
      </div>
    </section>
  </main>
  <div class="undo" role="status" inert>
    <p></p>
    <button class="text-btn" id="undo" type="button">Вернуть</button>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
