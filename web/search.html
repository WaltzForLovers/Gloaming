<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gloaming — Search</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="search">
  <div class="bar" aria-hidden="true"></div>
  <header class="top">
    <div class="brand-row">
      <a class="brand" href="queue.html">Gloaming</a>
      <nav class="nav">
        <a href="queue.html" data-page="queue">Queue</a>
        <a href="search.html" data-page="search">Search</a>
      </nav>
    </div>
    <div class="session">
      <span class="who"></span>
      <button class="text-btn" id="logout" type="button">Sign out</button>
    </div>
  </header>
  <main class="page">
    <section class="search-hero">
      <p class="eyebrow">Search</p>
      <h1>What's on tonight?</h1>
      <form class="search-form">
        <input name="q" placeholder="Title" autocomplete="off">
        <button class="primary" type="submit">Search</button>
      </form>
      <div class="tries">
        <span class="tries-label">Try</span>
        <button class="try" type="button">Frieren</button>
        <button class="try" type="button">Severance</button>
        <button class="try" type="button">The Bear</button>
        <button class="try" type="button">Dune</button>
      </div>
    </section>
    <div class="alert"><div><p></p></div></div>
    <p class="hint" hidden></p>
    <section class="discover" hidden>
      <div class="pick-head">
        <h2 class="section-title">For you</h2>
        <button class="text-btn pick-more" type="button" hidden>More</button>
      </div>
      <div class="pick-list"></div>
    </section>
    <div class="filters" hidden></div>
    <div class="hits"></div>
    <button class="text-btn manual-open" type="button" hidden>Not the one — add your own</button>
    <form class="manual" hidden>
      <p class="manual-lead"></p>
      <div class="manual-fields">
        <label>Year<input name="year" inputmode="numeric" autocomplete="off"></label>
        <label>Episodes<input name="episodes" inputmode="numeric" autocomplete="off"></label>
        <label>Minutes<input name="average" inputmode="numeric" autocomplete="off"></label>
      </div>
      <button class="primary" type="submit">Create card</button>
    </form>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
