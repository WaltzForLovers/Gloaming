<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gloaming — Поиск</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="search">
  <div class="bar" aria-hidden="true"></div>
  <header class="top">
    <div class="brand-row">
      <a class="brand" href="queue.html">Gloaming</a>
      <nav class="nav">
        <a href="queue.html" data-page="queue">Очередь</a>
        <a href="search.html" data-page="search">Поиск</a>
      </nav>
    </div>
    <div class="session">
      <span class="who"></span>
      <button class="text-btn" id="logout" type="button">Выйти</button>
    </div>
  </header>
  <main class="page">
    <h1>Поиск</h1>
    <form class="search-form">
      <input name="q" placeholder="Название" autocomplete="off">
      <button class="primary" type="submit">Найти</button>
    </form>
    <div class="alert"><div><p></p></div></div>
    <p class="hint">Введите название</p>
    <div class="hits"></div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
