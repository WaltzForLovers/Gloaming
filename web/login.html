<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gloaming — Вход</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="login">
  <div class="bar" aria-hidden="true"></div>
  <main class="gate-screen">
    <section class="auth-card">
      <a class="brand" href="login.html">Gloaming</a>
      <p class="lede">Очередь просмотра и сколько она займёт.</p>
      <h1>Вход</h1>
      <form>
        <label>Имя<input name="username" autocomplete="username"></label>
        <label>Пароль<input name="password" type="password" autocomplete="current-password"></label>
        <div class="alert"><div><p></p></div></div>
        <button class="primary" type="submit">Войти</button>
      </form>
      <p class="switch"><a href="forgot.html">Забыли пароль</a></p>
      <p class="switch"><a href="register.html">Создать аккаунт</a></p>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
