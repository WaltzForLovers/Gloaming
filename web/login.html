<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gloaming — Sign in</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="login">
  <div class="bar" aria-hidden="true"></div>
  <main class="gate-screen">
    <section class="auth-card">
      <a class="brand" href="login.html">Gloaming</a>
      <p class="lede">A watch queue, and how long it takes.</p>
      <h1>Sign in</h1>
      <form>
        <label>Name or email<input name="username" autocomplete="username"></label>
        <label>Password<input name="password" type="password" autocomplete="current-password"></label>
        <div class="alert"><div><p></p></div></div>
        <button class="primary" type="submit">Sign in</button>
      </form>
      <p class="switch"><a href="forgot.html">Forgot password</a></p>
      <p class="switch"><a href="register.html">Create an account</a></p>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
